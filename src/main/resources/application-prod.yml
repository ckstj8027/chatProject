server:
  port: 8080
spring:
  redis:
    host: ${REDIS_CLUSTER_NODES}
    port: 6379
  data:
    redis:
      cluster:
        nodes:
          - ${REDIS_CLUSTER_NODES}
      ssl:
        enabled: true  # 전송 암호화 때문에 필수!
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}/chatdb?useSSL=false&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secretKey: ${JWT_SECRET}
  expiration: 3000

websocket:
  allowed-origins: ${FRONTEND_URL}