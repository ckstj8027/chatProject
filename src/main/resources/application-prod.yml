server:
  port: 8080
spring:
  data:
    redis:
      host: ${REDIS_HOST}  # 단일 모드 엔드포인트
      port: 6379
      ssl:
        enabled: true  # 전송 암호화 활성화됨
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}/chatdb?useSSL=false&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secretKey: ${JWT_SECRET}
  expiration: 3000

websocket:
  allowed-origins: ${FRONTEND_URL}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.example.chatserver: DEBUG
